name: Build and publish DEB

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Run each supported distro target as a container on a supported runner.
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '20.04'
            frontend: fcitx4
          - ubuntu: '22.04'
            frontend: fcitx5
          - ubuntu: '24.04'
            frontend: fcitx5
          - ubuntu: '26.04'
            frontend: fcitx5
    timeout-minutes: 30
    # Force unattended mode: no debconf/locale/timezone questions can stall
    # an unattended build.
    env:
      DEBIAN_FRONTEND: noninteractive
      DEBCONF_NONINTERACTIVE_SEEN: 'true'
      APT_LISTCHANGES_FRONTEND: none
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: Etc/UTC
    steps:
      - name: Prepare apt universe and git
        run: |
          apt-get update -o Acquire::Retries=3
          apt-get install -y --no-install-recommends \
            software-properties-common ca-certificates git
          add-apt-repository -y universe
          apt-get update -o Acquire::Retries=3

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          apt-get install -y --no-install-recommends \
            -o Dpkg::Options::=--force-confdef \
            -o Dpkg::Options::=--force-confold \
            build-essential cmake dpkg-dev pkg-config python3 \
            extra-cmake-modules

          # Ubuntu 20.04 provides Fcitx 4 only. Newer releases provide Fcitx 5,
          # whose packages conflict with fcitx-bin from fcitx-libs-dev.
          if [ "$UBUNTU_VERSION" = "20.04" ]; then
            apt-get install -y --no-install-recommends fcitx-libs-dev
          else
            apt-get install -y --no-install-recommends \
              libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
              fcitx5-modules-dev fcitx5
          fi

      - name: Build, test and package
        env:
          FETCH_SDK: '0'
          JOBS: '2'
          ZHIYI_FRONTEND: ${{ matrix.frontend }}
        run: bash scripts/build-deb.sh

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-ubuntu-${{ matrix.ubuntu }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_TERMINAL_PROMPT: '0'
      GH_PROMPT_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Release notes fall back to the commit range between tags.
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download DEB artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deb-ubuntu-*
          path: artifacts

      - name: Prepare release notes and assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          for f in artifacts/*/*.deb; do
            distro="$(basename "$(dirname "$f")")"
            cp "$f" "release-assets/${distro}_$(basename "$f")"
          done

          # Prefer the curated, human-readable summary from CHANGELOG.md.
          # GitHub's --generate-notes only lists merged PRs, which is empty
          # for direct pushes; a commit list is used only as a last resort.
          summary="$(awk -v ver="$VERSION" '
            /^## / { if (inside) exit; if (index($0, "[" ver "]")) { inside=1; next } }
            inside { print }
          ' CHANGELOG.md)"
          prev_tag="$(git describe --tags --abbrev=0 "${REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
            range="${prev_tag}..${REF_NAME}"
            compare="**完整变更**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${REF_NAME}"
          else
            range="$REF_NAME"
            compare=""
          fi
          {
            echo "## 更新内容"
            echo
            if [ -n "$summary" ]; then
              printf '%s\n' "$summary"
            else
              echo "> 本版本暂未编写摘要，以下为提交记录："
              echo
              echo "本次发布共 $(git rev-list --count --no-merges "$range") 项提交："
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "$range"
              echo
            fi
            echo
            if [ -n "$compare" ]; then
              echo "$compare"
            fi
            echo
            echo "安装包（Release 附件）："
            for f in release-assets/*.deb; do
              echo "- \`$(basename "$f")\`"
            done
          } > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$REF_NAME" release-assets/*.deb \
            --title "知意输入法 Linux v${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
